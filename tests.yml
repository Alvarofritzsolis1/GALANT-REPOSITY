name: Pruebas de auditoría laboral

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar motor OCR del sistema
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Verificar sintaxis
        run: python -m compileall -q app.py f301.py clasificador_documentos.py pages auditoria_laboral.py previred_pdf.py previred_scan_fast.py aprendizaje_revisiones.py control_asistencia.py certificados_previred.py bateria_regresion.py diagnostico_ocr.py explicaciones_revision.py ui_v8.py ui_v11.py control_independientes.py test_v8_independientes.py
      - name: Ejecutar pruebas de lógica y de aplicación
        run: python -m pytest -q
